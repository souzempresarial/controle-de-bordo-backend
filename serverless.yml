org: souzfinance
app: souz-finance-api
service: souz-finance-api

useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  region: sa-east-1
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    CORS_ORIGIN: ${env:CORS_ORIGIN, '*'}
    BREVO_API_KEY: ${env:BREVO_API_KEY}
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY}
    GOOGLE_API_KEY: ${env:GOOGLE_API_KEY}
    FRONTEND_URL: ${env:FRONTEND_URL, 'https://controle-de-bordo-react.vercel.app'}

functions:
  api:
    handler: handler.handler
    timeout: 29
    events:
      - httpApi:
          path: /
          method: any
      - httpApi:
          path: /{proxy+}
          method: any

  extrato:
    handler: extratoHandler.handler
    timeout: 120
    url:
      cors: true

  alertas:
    handler: alertasHandler.alertas
    timeout: 60
    events:
      - schedule: cron(0 11 * * ? *)  # 08:00 BRT (11:00 UTC) todos os dias
